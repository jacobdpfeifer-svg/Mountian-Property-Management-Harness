timezone: America/Denver

owners:
  # TODO(placeholder names): replace with the real owner names before any
  # owner-facing report (statements, dashboards, emails) ships. Confirmed
  # 2026-09-20 with the operator that these are intentionally left as
  # placeholders for now, not an oversight.
  northwoods:
    name: Northwoods owner  # TODO: replace with real owner name
    properties: [summit_haus, overlook_ridge]
    # TODO(operator-confirm): management fee as a fraction of gross booking
    # revenue. The owner receipt shows "not configured" while this is null.
    management_fee_pct: null
  cloud9:
    name: Cloud 9 owner  # TODO: replace with real owner name
    properties: [cloud_9]
    management_fee_pct: null  # TODO(operator-confirm)

properties:

# Winter Park Resort reference corpus — static deep knowledge.
# Live status comes from the Intrawest feed; this file holds priors the APIs omit.

resort_id: winter_park
market_id: grand_home
intrawest_feed_id: 5

season:
  typical_open: "11-15"
  typical_close: "04-15"
  hiring_ramp_start: "08-01"
  hiring_ramp_end: "10-31"
  staffing_readiness_prior: 0.75  # after Oct 1, more lifts likely to spin up

mountain_areas:
  - Winter Park
  - Mary Jane
  - The Cirque
  - Eagle Wind
  - Parsenn Bowl
  - Vasquez Ridge

# Typical terrain opening sequence (earliest → latest).
terrain_opening_sequence:
  - area: Winter Park
    lifts: [Gondola, Discovery, Gemini Express]
    swe_threshold_in: 8
  - area: Mary Jane
    lifts: [Super Gauge Express, Olympia Express]
    swe_threshold_in: 14
  - area: Eagle Wind
    lifts: [Eagle Wind]
    swe_threshold_in: 18
  - area: Parsenn Bowl
    lifts: [Panoramic Express]
    swe_threshold_in: 20
  - area: The Cirque
    lifts: [Cirque Sled]
    swe_threshold_in: 24

# Lifts especially sensitive to wind holds (curated operator prior).
wind_hold_lifts:
  - Panoramic Express
  - Eagle Wind
  - Super Gauge Express
  - Iron Horse
  - Hi-Lonesome Express

wind_hold:
  gust_threshold_mph: 35
  risk_per_mph_above: 0.02  # additive risk above threshold

lifts:
  - name: Gondola
    area: Winter Park
    type: gondola
    wind_sensitive: false
  - name: Panoramic Express
    area: Mary Jane
    type: high_speed_quad
    wind_sensitive: true
  - name: Super Gauge Express
    area: Mary Jane
    type: high_speed_quad
    wind_sensitive: true
  - name: Eagle Wind
    area: Eagle Wind
    type: high_speed_quad
    wind_sensitive: true
  - name: Cirque Sled
    area: The Cirque
    type: surface
    wind_sensitive: true
  - name: Gemini Express
    area: Winter Park
    type: high_speed_quad
    wind_sensitive: false
  - name: Discovery
    area: Winter Park
    type: triple
    wind_sensitive: false


# Snow packing tendencies by calendar month (declared priors).
packing_rules:
  - months: [11, 12]
    label: machine_made_thin
    temp_max_c: -2
    surface_score: 0.55
  - months: [1, 2, 3]
    label: packed_powder
    temp_max_c: -5
    surface_score: 0.85
  - months: [4, 5]
    label: spring_corn
    temp_min_c: 0
    surface_score: 0.70

# Historical season open dates (seed — extend via resort_events).
historical_season_opens:
  - season: "2023-24"
    date: "2023-11-17"
  - season: "2024-25"
    date: "2024-11-22"
  - season: "2025-26"
    date: "2025-11-21"


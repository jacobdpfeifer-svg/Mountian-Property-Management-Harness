rule_version: "2026.08.3"
model_version: "rules_v2_revpan"

# ---------------------------------------------------------------- global clamps
global:
  min_price: 150
  max_price: 5000
  round_to: 5

# ------------------------------------------------------------- price composition
# Previously hardcoded in src/compose.py. Doctrine requires engine numbers live here.
compose:
  # E[RevPAN] search grid over [floor, ceiling]
  candidate_steps: 40
  # Anchor blend used only when history is too thin to trust (confidence < 1.0).
  base_ceiling_anchor_ratio: 0.85
  # DEFERENCE TO THE INCUMBENT PRICE.
  # The operator's current listed price is itself evidence — they set it deliberately
  # and with context the model does not have. When our own confidence is low, the model
  # must not override that judgement wholesale.
  # Measured motivation: last Christmas these listings averaged $482/night; this
  # Christmas they average $2,845 and sold at $3,482. A model fitted on that history
  # wanted a -35% cut on the strongest nights of the year — i.e. to restore last
  # season's underpricing. Deference makes low-confidence recommendations advisory
  # nudges rather than confident reversals.
  deference:
    enabled: true
    below_confidence: 0.80
    # weight on the model = ceiling confidence; remainder sits on the listed price
    min_model_weight: 0.25
    # Ceiling is advisory on this same band so a thin ceiling cannot undo the
    # move cap after rounding (the 0.30 cutoff left 0.30–0.80 still hard-clamping).
    advisory_ceiling_below_confidence: 0.80

dow_multipliers:
  0: 0.92
  1: 0.92
  2: 0.95
  3: 0.98
  4: 1.08
  5: 1.12
  6: 1.00

lead_time_curves:
  - {min_days: 0,   max_days: 7,    multiplier: 0.90}
  - {min_days: 8,   max_days: 21,   multiplier: 0.97}
  - {min_days: 22,  max_days: 60,   multiplier: 1.00}
  - {min_days: 61,  max_days: 120,  multiplier: 1.03}
  - {min_days: 121, max_days: 9999, multiplier: 1.05}

# --------------------------------------------------------------- min-stay rules
# Dynamic minimum-stay lookup: season × lead time → min nights.
# Far out + unsold → higher min (protects peak weekends from fragmentation).
# Close-in + unsold → lower min (fills the calendar).
#
# OWNER DECISION: Confirm these buckets/values before enabling Guesty auto-push
# of minNights. Defaults are reasoned starting points for sleeps-16–18 WP homes.
min_stay_rules:
  enabled: true
  fallback_min_nights: 2
  by_season:
    peak_ski:
      - {min_lead_days: 0,    max_lead_days: 14,   min_nights: 2}
      - {min_lead_days: 15,   max_lead_days: 60,   min_nights: 3}
      - {min_lead_days: 61,   max_lead_days: 9999, min_nights: 4}
    early_winter:
      - {min_lead_days: 0,    max_lead_days: 21,   min_nights: 2}
      - {min_lead_days: 22,   max_lead_days: 9999, min_nights: 3}
    summer:
      - {min_lead_days: 0,    max_lead_days: 14,   min_nights: 2}
      - {min_lead_days: 15,   max_lead_days: 9999, min_nights: 3}
    shoulder_spring:
      - {min_lead_days: 0,    max_lead_days: 9999, min_nights: 2}
    shoulder_fall:
      - {min_lead_days: 0,    max_lead_days: 9999, min_nights: 2}
    default:
      - {min_lead_days: 0,    max_lead_days: 9999, min_nights: 2}

seasons:
  peak_ski:        {start: "12-15", end: "03-31", base_multiplier: 1.15}
  shoulder_spring: {start: "04-01", end: "05-31", base_multiplier: 0.85}
  summer:          {start: "06-01", end: "09-15", base_multiplier: 1.05}
  shoulder_fall:   {start: "09-16", end: "11-20", base_multiplier: 0.88}
  early_winter:    {start: "11-21", end: "12-14", base_multiplier: 1.00}

# ------------------------------------------------------------------- ceiling
# A ceiling built from the wrong season is the most dangerous number in the system:
# it silently licenses large moves on nights that cannot support them.
ceiling:
  percentile: 0.90
  min_history_nights: 5
  # Multi-year same-season window (locked 2026-09-20). Use prior years of THIS
  # season; do not discard them at 12 months. Cross-season mixing stays forbidden:
  # five years of peak-ski still cannot price a shoulder night.
  history_lookback_years: 5
  yoy_calendar_window_days: 14
  allow_cross_season_fallback: false
  # Confidence by which method produced the ceiling. Drives blending toward the
  # seasonal anchor and caps how far guardrails will let a price move.
  confidence:
    season_dow_yoy: 1.00
    season_dow: 1.00
    season: 0.80
    seasonal_anchor: 0.45
  # Seasonal anchor is taken from the property's own listed prices for that season
  # rather than a configured base rate. See src/ceiling.seasonal_anchor.
  anchor_listed_percentile: 0.75
  anchor_min_listed_nights: 20
  # Within a season, anchor on nights of the same demand tier. peak_ski runs
  # 15 Dec - 31 Mar; without this, Christmas anchors to a mid-January price.
  anchor_min_tier_nights: 8
  demand_tiers:
    high: 0.80
    mid: 0.45
  # Market blend: how much curated/scraped comp evidence moves the ceiling.
  # Applied only when comp coverage passes data_health thresholds.
  comp_blend_weight: 0.30
  comp_percentile: 0.75

# --------------------------------------------------------------- booking model
# Pooled, transparent booking-probability model. The implementation uses a
# first-order linear demand curve around P_ref; beta is its local slope.
# beta is elasticity BY SEASON: luxury peak inventory is inelastic, shoulder is not.
# This is what makes RevPAN a real objective instead of a label.
booking_probability:
  # Portfolio prior booking rate, used when a bucket has too little data.
  prior_book_rate: 0.55
  # Shrinkage strength toward the prior (pseudo-observations).
  shrinkage_k: 12
  min_bucket_nights: 8
  # Elasticity by season. |beta| < 1 => revenue rises with price => optimum is the
  # ceiling, which is honest for inelastic peak inventory. Shoulder must be elastic
  # or the optimizer degenerates to "always charge the ceiling".
  elasticity_by_season:
    peak_ski:        -0.65
    early_winter:    -1.35
    shoulder_spring: -1.70
    shoulder_fall:   -1.70
    summer:          -1.10
    default:         -1.20
  # Pacing feedback: if a night is filling slower than the reference curve,
  # treat demand as more elastic (multiply |beta|).
  pacing_elasticity_scale: 1.30
  pacing_behind_threshold: 0.70
  # Do not print p(book) as a percentage until pacing history meets this bar.
  min_pacing_days_for_display: 14
  # P(book | still available at this lead time), learned from pacing snapshots of
  # nights that have already checked in. Shrinks the pooled rate toward it.
  # Price is unchanged by this (linear demand's argmax does not depend on p_ref);
  # it fixes the probability shown and scored.
  lead_conditioning:
    enabled: true
    shrinkage_k: 12
    min_same_season: 20

# --------------------------------------------------------------------- leakage
leakage:
  peak_underprice:
    min_demand_strength: 0.65
    underprice_ratio: 0.85
  shoulder_over_discount:
    max_demand_strength: 0.35
    floor_ratio: 0.95
  orphan_gap:
    max_gap_nights: 2
    discount_multiplier: 0.88
    # The real orphan-gap lever is min-stay, not price. Flag it for the operator.
    suggest_min_stay_relaxation: true
    # OWNER DECISION: When true and autonomy is handle, push relaxed minNights
    # alongside the rate. Set false to keep gap overrides suggest-only.
    push_min_stay_relaxation: true

# ---------------------------------------------------------------------- scrape
# Comp acquisition. Operator chose scraper-first (docs/LOCKED_INPUTS.md).
scrape:
  provider: "airbnb_sweep"
  window_nights: 2
  horizon_days: 120
  zoom: 14
  timeout_s: 60
  window_timeout_s: 180
  run_deadline_s: 3600
  property_calendar_timeout_s: 180
  # Politeness is load-bearing: an aggressive sweep gets blocked and the whole comp
  # layer degrades to advisory. One market-wide sweep covers every comp at once.
  min_request_delay_s: 4.0
  max_request_delay_s: 8.0
  # Winter Park / Fraser Valley bounding box.
  bbox:
    ne_lat: 39.95
    ne_lng: -105.70
    sw_lat: 39.85
    sw_lng: -105.82
  # Comp evidence is consumed at the season x day-of-week level, so an observation
  # may stand in for a nearby night of the same weekday class.
  match:
    max_day_distance: 10
    require_same_dow_class: true
  # Group-size tier filter. Portfolio is 5–6bd / sleeps 16–18; small units must
  # not contaminate ceiling/elasticity. OWNER DECISION: twins are 5bd — a 6+
  # bedroom cutoff would exclude valid peers; default is bedrooms ≥ 5, sleeps ≥ 14.
  group_size:
    min_bedrooms: 5
    min_sleeps: 14
    # When bedrooms/sleeps are unknown on a curated member, keep them (operator
    # curated intentionally). Discovery still requires known size when filtering.
    keep_unknown_curated: true
  # A broken parser returns plausible garbage, not exceptions. These reject a sweep
  # that looks like a failure rather than a market.
  validation:
    min_listings_per_sweep: 25
    min_parse_rate: 0.70
    max_identical_share: 0.60
    min_plausible_price: 20
    max_plausible_price: 20000
    max_change_ratio: 5.0
    min_window_success_rate: 0.70
    min_comp_match_rate: 0.60
  discover:
    min_price: 400
    limit: 40
    # Inherit scrape.group_size unless overridden here.
    apply_group_size_filter: true

# ------------------------------------------------------------- post-run audit
audit:
  twin_listed_max_pct: 0.15   # twins compared only when listed prices within this band
  twin_max_delta: 50          # max recommended-price gap on comparable twin nights

# ------------------------------------------------------------------ guardrails
# Hard invariants. NO autonomy level may override these.
guardrails:
  max_increase_pct: 0.12
  max_decrease_pct: 0.15
  # Absolute ceiling on movement regardless of percentage, per night, per run.
  max_abs_move: 250
  # Nights whose price may never be changed automatically, at any autonomy level.
  auto_push_blackout_demand_strength: 0.85
  # Cap on how much of the calendar one run may move.
  max_nights_changed_per_run: 40
  max_pct_of_open_nights_per_run: 0.35
  # A price below this fraction of the seasonal anchor is treated as a bug, not a bid.
  sanity_min_ratio_to_anchor: 0.40
  # A price above this MULTIPLE of the seasonal anchor is treated as a bug, not a
  # bid — checked on the price actually being returned (post move-cap), because a
  # corrupted `listed` price can otherwise pull the move-cap band itself far above
  # a sane value. See src/guardrails.apply_guardrails.
  sanity_max_ratio_to_anchor: 3.0

# ------------------------------------------------------------------ data health
# Autonomy is DERIVED from these. See docs/rules/AUTONOMY.md.
data_health:
  pms_max_staleness_hours: 24
  comp_max_staleness_hours: 48
  comp_min_coverage: 0.60       # fraction of comp set with a usable snapshot
  comp_min_members: 3
  pacing_min_snapshot_days: 14  # days of pacing history before pacing signals are trusted
  demotion_grace_runs: 2        # consecutive failed runs before handle demotes

autonomy:
  # Ladder: watch < suggest < handle < escalate
  # 'handle' is the only level that writes rates.
  max_level: "handle"
  require_ceiling_confidence: 0.80   # below this -> suggest only

explain:
  max_reasons: 3

# ----------------------------------------------------------- display framing
# Per-person price is DISPLAY ONLY — never feeds RevPAN / compose.
# OWNER DECISION: divisor defaults to Guesty `accommodates` (persisted as
# max_occupancy). Override per property in the DB if advertised sleeps differ.
display:
  per_person:
    enabled: true
    # Round per-person figure to this many dollars for listing copy.
    round_to: 1

# ---------------------------------------------------------------------- access (CDOT)
access:
  enabled: true
  beta_scale_when_risk_above: 0.5
  beta_scale_factor: 1.25
  max_upward_move_when_risk_above: 0.8
  max_upward_move_pct: 0.05
  escalate_when_closed_lead_days: 3

# -------------------------------------------------------------- resort ops risk
resort_ops:
  enabled: true
  closure_risk_threshold: 0.80
  escalate_when_closed_lead_days: 3
  demote_when_resort_closed: true

# ---------------------------------------------------------------- substitution bleed
substitution:
  enabled: true
  index_threshold: 1.15
  max_ceiling_reduction_pct: 0.15
  substitute_markets: [summit, clear_creek_eagle]
  price_percentile: 0.75

# ------------------------------------------------------------------- intent (Track B)
intent:
  enabled: false
  min_lead_days: 30
  max_lead_days: 90
  z_score_high: 1.5
  z_score_low: -1.0
  p_ref_nudge_pct: 0.05

# ------------------------------------------------------------------- flight (Track B)
flight:
  enabled: false
  brief_only: true
  min_lead_days: 60
  capacity_yoy_threshold: 0.10
  p_ref_nudge_pct: 0.05

validation:
  lead_le_21:
    lo: 0.30
    hi: 0.75
    source: "first party 28/47 = 0.60 is June-Dec stays (summer heavy). Colorado ski markets average 24-33 day booking windows (Beyond Pricing: Breckenridge 26, Park City 24, Tahoe 33) and large houses book further out than condos (KeyData ski forecast), so the winter floor is lowered to 0.30 (2026-10-14)"
  los_mean: {lo: 2.5, hi: 6.5, source: "first party mean 3.64, widened for a winter mix"}
  inquiry_per_confirmed: {lo: 0.40, hi: 1.60, source: "first party 40/47 = 0.85, widened"}
  occupancy_peak: {lo: 0.25, hi: 0.75, source: "suggestive — partial 2026 book, widened"}
  occupancy_early: {lo: 0.10, hi: 0.55, source: "suggestive — partial 2026 book, widened"}


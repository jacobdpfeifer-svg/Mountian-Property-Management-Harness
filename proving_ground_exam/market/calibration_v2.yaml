# Calibration v2 — 2026-10-14 overhaul (docs/plans/OVERHAUL_2026-10-14.md).
#
# v1 (calibration.yaml) priced the whole market at $620-$910: every shopper's cap was a
# multiplier x one $700 median, the same for every home and season, and competitors
# quoted fixed $620-$700. The homes really list near $2,000/night at peak and above
# $3,300 in holiday week. v2 changes, each with a source:
#   - market_reference by season and holiday, from publicly listed prices of the curated
#     large-home comp set and of the homes themselves (operator DB, as of 2026-10-14);
#   - per-home value_index and the real capacities (Cloud 9 sleeps 18);
#   - guest fees judged all-in (FTC 2024 total-price rule), competitor fees assumed;
#   - families' per-season segment columns restored from SIM_PARAMETERS.md;
#   - competitors priced as ratios to the reference;
#   - owner economics (channel fee, management fee, turnover costs) for owner-net scoring;
#   - current_practice: the homes' real seasonal listed prices as a benchmark.
# Booked (confidential) prices are NOT here: this repo is public. They live in the
# gitignored data/exports/rate_card.yaml and are used only by the validation script.
# Every mapping that carries a "value" must also carry a "source".
version: 2
market_id: grand_home
season_start: "2026-11-01"
season_end: "2027-04-29"

# Kept for tools that still read it; v2 shoppers use market_reference.
median_nightly: {value: 700, source: "v1 value; unused by v2 choice", confidence: low}

market_reference:
  early_winter:
    value: 900
    source: "comp-set listed medians Nov-mid Dec 2026 (14 large homes, median ~$1,030) blended with the homes' own listed medians ($521-$850); operator DB 2026-10-14"
    confidence: low
    sweep: [700, 1100]
  peak_ski:
    value: 2000
    source: "comp-set listed medians Jan-Mar 2027 (5 homes with quotes, median $2,073); own listed medians $2,006-$2,153; operator DB 2026-10-14"
    confidence: medium
    sweep: [1500, 2400]
  holiday:
    value: 2600
    source: "comp holiday medians (6 homes, median ~$1,790) vs own listed $3,363-$3,489; ski-market holiday premium +40-80% over peak (RedAwning 2026, Xplorie 2019): 2,000 x 1.3"
    confidence: low
    sweep: [1800, 3400]
  shoulder_spring:
    value: 650
    source: "own listed April medians $538-$850; v1 shoulder flat $650; no comp quotes"
    confidence: low
    sweep: [500, 850]
  thanksgiving:
    value: 1200
    source: "Thanksgiving week 2026: homes list $952-$1,218; comps $1,295 and $2,875 (operator DB 2026-10-14)"
    confidence: low
    sweep: [950, 1600]
  presidents:
    value: 2300
    source: "Presidents' Day weekend: homes list ~$3,050 (1.5x other Jan-Feb nights); scaled by the Christmas reference/own-listed ratio (2,600/3,420)"
    confidence: low
    sweep: [1900, 3000]

# Holiday spans with their own reference level (v1 used fixed spans and one level).
# MLK lists slightly below other January nights, so it keeps the peak reference and
# only the holiday arrival boost.
holidays:
  - {name: thanksgiving, start: "2026-11-25", end: "2026-11-29", reference: thanksgiving}
  - {name: christmas_new_year, start: "2026-12-19", end: "2027-01-03", reference: holiday}
  - {name: mlk, start: "2027-01-16", end: "2027-01-19", reference: peak_ski}
  - {name: presidents, start: "2027-02-13", end: "2027-02-16", reference: presidents}

arrival_mean: {value: 3.2, source: "assumed, swept", confidence: low, sweep: [2.0, 3.2, 5.0]}
holiday_multiplier: {value: 1.8, source: "assumed, swept (arrival boost)", confidence: low}
conversion: {value: 0.55, source: "assumed, swept — not the 40/47 inquiry ratio", confidence: low}
mixed_logit_sigma: {value: 0.25, source: "assumed, swept", confidence: low}
fit_penalty: {value: -1.2, source: "assumed", confidence: low}
fit_ratio: {value: 0.35, source: "assumed", confidence: low}
outside_utility: {value: 0.0, source: "normalization", confidence: high}
scrape_log_sigma: {value: 0.04, source: "assumed", confidence: low}
scrape_missing_prob: {value: 0.08, source: "assumed", confidence: low}
undercut_factor: {value: 0.92, source: "assumed, SIM_PARAMETERS competitor rules", confidence: low}

# Guests pay these on top of the nightly rate; platforms show the total.
guest_fees:
  cleaning_per_stay: {value: 600, source: "operator (2026-10-14): $600 cleaning fee", confidence: high}
  per_guest: {value: 75, source: "operator (2026-10-14): $75 per guest consumables", confidence: high}
  insurance_per_stay: {value: 80, source: "operator (2026-10-14): $80 insurance", confidence: high}
competitor_fees:
  cleaning_per_stay: {value: 500, source: "assumed for 16-sleeper homes; not scraped yet", confidence: low, sweep: [300, 700]}
  per_guest: {value: 0, source: "assumed", confidence: low}
  insurance_per_stay: {value: 0, source: "assumed", confidence: low}
fee_salience:
  value: 1.0
  source: "FTC rule on unfair or deceptive fees (Dec 2024): short-term lodging must show the total price most prominently; Blake et al. (StubHub) show fee display changes conversion"
  confidence: medium
  sweep: [0.5, 1.0]
enforce_capacity: true

economics:
  management_fee: {value: 0.25, source: "operator chose 25% for now (2026-10-14); ski-market full service 20-35% (LocalVR Vail/Park City/Big Sky, SkyRun)", confidence: low, sweep: [0.20, 0.35]}
  channel_fee:
    airbnb: {value: 0.155, source: "Airbnb host-only fee for PMS-connected hosts (Hostaway, 2025)", confidence: medium}
    vrbo: {value: 0.08, source: "assumed: VRBO pay-per-booking 5% + ~3% processing; not verified", confidence: low}
    direct: {value: 0.03, source: "assumed card processing", confidence: low}
    default: {value: 0.155, source: "Airbnb rate as the conservative default", confidence: low}
  turnover_cost_per_stay: {value: 350, source: "assumed; $300-450 per turn for a large ski home (weak source; Turno Colorado data stops at 3BR)", confidence: low, sweep: [300, 450]}
  consumables_cost_per_guest: {value: 75, source: "assumed pass-through of the $75 fee", confidence: low}
  insurance_cost_per_stay: {value: 80, source: "assumed pass-through of the $80 fee", confidence: low}

cancel_hazard:
  ge_60: {value: 0.004, source: "assumed, swept", confidence: low}
  ge_21: {value: 0.002, source: "assumed, swept", confidence: low}
  ge_8: {value: 0.001, source: "assumed, swept", confidence: low}
  ge_0: {value: 0.0004, source: "assumed, swept", confidence: low}

# One market-rate price for all three homes (continuity benchmark).
flat_price:
  peak_ski: {value: 2000, source: "= market_reference.peak_ski", confidence: low}
  holiday: {value: 2600, source: "= market_reference.holiday", confidence: low}
  thanksgiving: {value: 1200, source: "= market_reference.thanksgiving", confidence: low}
  presidents: {value: 2300, source: "= market_reference.presidents", confidence: low}
  early_winter: {value: 900, source: "= market_reference.early_winter", confidence: low}
  shoulder_spring: {value: 650, source: "= market_reference.shoulder_spring", confidence: low}


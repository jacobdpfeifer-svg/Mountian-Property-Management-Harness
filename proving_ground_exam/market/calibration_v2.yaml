    agent: static_owner
    ratio: {value: 0.85, source: "cheaper large homes list ~0.6-0.9x the reference (The Views, Family Friendly)", confidence: low}
    sleeps: 16
    quality: {value: 0.85, source: "assumed, swept", confidence: low}
  comp_follower:
    agent: market_follower
    ratio: {value: 1.0, source: "follows yesterday's median", confidence: low}
    sleeps: 16
    quality: {value: 0.90, source: "assumed, swept", confidence: low}
  comp_tool:
    agent: generalized_tool
    ratio: {value: 1.0, source: "tool base at the reference", confidence: low}
    sleeps: 18
    quality: {value: 0.95, source: "assumed, swept", confidence: low}
  comp_undercut:
    agent: undercutter
    sleeps: 14
    quality: {value: 0.80, source: "assumed, swept", confidence: low}
  comp_premium:

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-str-pricing"
version = "0.1.0"
description = "Winter Park STR Pricing & Optimization Engine — rules-first RevPAN optimizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "icalendar>=6.0",
  "python-dateutil>=2.9",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "vulture>=2.11",
  "pip-audit>=2.7",
  "types-PyYAML>=6.0",
]
# Comp scraping. Kept optional so the engine still imports and runs advisory-only
# on a machine without it.
scrape = ["pyairbnb>=2.2.2"]

[project.scripts]
wp-price = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.12"
packages = ["src"]
ignore_missing_imports = true

[tool.vulture]
min_confidence = 80
paths = ["src", "scripts"]
